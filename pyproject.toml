[project]
name = "oecd-universe"
version = "0.1.0"
description = "Versioned, auditable local OECD public-data foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.3",
  "httpx>=0.28",
  "polars>=1.30",
  "pyarrow>=20",
  "pydantic>=2.11",
  "rich>=14",
  "sdmx1>=2.20",
  "tenacity>=9.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.12"]

[project.scripts]
oecd-universe = "oecd_universe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oecd_universe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

